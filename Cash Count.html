<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=yes">
  <title>Cash Count · Naira tally</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --orange: #f58220;
      --orange-soft: #fff2e5;
      --orange-deep: #c95f0a;
      --navy: #142b44;
      --navy-light: #1e3a5a;
      --line: #dbe4ee;
      --bg: #f2f6fc;
      --white: #ffffff;
      --shadow: 0 4px 12px rgba(0, 20, 30, 0.04), 0 2px 4px rgba(0, 0, 0, 0.02);
      --radius: 18px;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
    }

    body {
      background: var(--bg);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      color: var(--navy);
      line-height: 1.4;
      padding: 0 0 24px;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }

    /* header */
    .app-header {
      background: linear-gradient(135deg, #17324d 0%, #1e405e 100%);
      color: white;
      padding: 18px 16px 16px;
      border-bottom: 3px solid var(--orange);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .app-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .app-header h1 span {
      background: var(--orange);
      font-size: 1.2rem;
      padding: 2px 10px;
      border-radius: 40px;
      line-height: 1.4;
    }

    .app-header p {
      font-size: 0.85rem;
      opacity: 0.85;
      font-weight: 400;
    }

    /* main container */
    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 0 12px;
    }

    /* compact reference strip - kept minimal */
    .ref-strip {
      background: var(--white);
      border-radius: 50px;
      padding: 8px 14px;
      margin: 14px 0 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 6px 12px;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      font-size: 0.7rem;
      font-weight: 500;
      color: #3d5a73;
    }

    .ref-strip span {
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .ref-strip strong {
      color: var(--orange-deep);
      background: var(--orange-soft);
      padding: 2px 7px;
      border-radius: 40px;
      font-weight: 700;
      font-size: 0.65rem;
    }

    /* ---- denomination cards ---- */
    .denom-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .denom-card {
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 12px 12px 10px;
      transition: 0.1s;
    }

    .denom-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .denom-label {
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--navy);
      letter-spacing: -0.01em;
    }

    .denom-label small {
      font-weight: 500;
      font-size: 0.65rem;
      color: #6a829b;
      margin-left: 4px;
    }

    .denom-total-notes {
      font-size: 0.7rem;
      background: #f0f6ff;
      padding: 3px 9px;
      border-radius: 40px;
      font-weight: 600;
      color: #2b4a6b;
    }

    .denom-total-value {
      font-weight: 800;
      font-size: 1rem;
      color: var(--orange-deep);
      background: #fffaf5;
      padding: 3px 10px;
      border-radius: 40px;
    }

    .unit-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }

    .unit-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #f9fcff;
      border-radius: 12px;
      padding: 6px 4px 5px;
      border: 1px solid #e4edf8;
    }

    .unit-item label {
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: #5a728b;
      font-weight: 600;
      margin-bottom: 3px;
    }

    .unit-item input {
      width: 100%;
      padding: 9px 4px;
      border: 1.5px solid #d0ddee;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      text-align: center;
      color: var(--navy);
      background: white;
      font-family: inherit;
      transition: 0.15s;
      -moz-appearance: textfield;
      appearance: textfield;
      min-width: 0;
    }

    .unit-item input::-webkit-outer-spin-button,
    .unit-item input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .unit-item input:focus {
      outline: none;
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(245, 130, 32, 0.2);
      background: #fffcf9;
    }

    /* running total card */
    .total-highlight {
      background: linear-gradient(145deg, #142b44, #1e3c5a);
      color: white;
      border-radius: var(--radius);
      padding: 16px 18px;
      box-shadow: 0 8px 20px -6px rgba(0, 30, 50, 0.3);
      margin-bottom: 12px;
    }

    .total-highlight .label {
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.75;
      margin-bottom: 4px;
    }

    .grand-total {
      font-size: 2rem;
      font-weight: 800;
      line-height: 1.1;
      word-break: break-word;
      color: #ffd9b3;
      margin-bottom: 2px;
    }

    .total-highlight small {
      font-size: 0.7rem;
      opacity: 0.7;
      display: block;
      margin-top: 2px;
    }

    /* bottom bar */
    .bottom-actions {
      background: var(--white);
      border-radius: var(--radius);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }

    .bottom-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .bottom-total-block .title {
      font-weight: 700;
      font-size: 0.85rem;
    }

    .bottom-total-block .sub {
      font-size: 0.65rem;
      color: #6a829b;
    }

    .bottom-amount {
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: -0.01em;
      background: #f0f6ff;
      padding: 4px 12px;
      border-radius: 60px;
      white-space: nowrap;
    }

    .reset-btn {
      background: var(--orange);
      border: none;
      color: white;
      font-weight: 700;
      font-size: 1rem;
      padding: 14px 20px;
      border-radius: 60px;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 4px 12px rgba(245, 130, 32, 0.25);
      font-family: inherit;
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .reset-btn:hover,
    .reset-btn:active {
      background: var(--orange-deep);
      box-shadow: 0 8px 18px rgba(245, 130, 32, 0.35);
    }

    .reset-btn:active {
      transform: scale(0.98);
    }

    .footnote {
      margin-top: 8px;
      font-size: 0.65rem;
      color: #6e8aa6;
      text-align: center;
      padding: 0 8px;
    }

    /* ---- larger screens ---- */
    @media (min-width: 600px) {
      .denom-list {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .bottom-actions {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .bottom-row {
        width: auto;
        flex: 1;
        gap: 18px;
        justify-content: flex-start;
      }

      .reset-btn {
        width: auto;
        min-width: 160px;
        padding: 14px 28px;
        flex-shrink: 0;
      }

      .app-header h1 {
        font-size: 2rem;
      }

      .grand-total {
        font-size: 2.4rem;
      }
    }

    /* ensure inputs don't zoom on ios */
    @supports (-webkit-touch-callout: none) {
      .unit-item input {
        font-size: 16px;
      }
    }

    /* safe area for notches */
    @supports (padding: max(0px)) {
      body {
        padding-bottom: max(24px, env(safe-area-inset-bottom));
      }
      .app-header {
        padding-top: max(18px, env(safe-area-inset-top));
      }
    }
  </style>
</head>
<body>

<header class="app-header">
  <div class="container" style="padding:0;">
    <h1>
      <span>₦</span> Cash Count
    </h1>
    <p>Stack · Bundle · Pack</p>
  </div>
</header>

<div class="container">
  <!-- ultra-minimal reference strip -->
  <div class="ref-strip">
    <span><strong>Pack</strong> 100</span>
    <span><strong>Bundle</strong> 500</span>
    <span><strong>Stack</strong> 10k</span>
  </div>

  <!-- denomination cards -->
  <div class="denom-list" id="denomList">
    <!-- injected by JS -->
  </div>

  <!-- running total -->
  <div class="total-highlight">
    <div class="label">Running total</div>
    <div class="grand-total" id="runningTotal">₦0.00</div>
    <small id="runningNotesSummary">0 notes</small>
  </div>

  <!-- bottom summary + reset -->
  <div class="bottom-actions">
    <div class="bottom-row">
      <div class="bottom-total-block">
        <span class="title">Total cash</span>
        <span class="sub">all denominations</span>
      </div>
      <div class="bottom-amount" id="bottomTotal">₦0.00</div>
    </div>
    <button class="reset-btn" id="resetButton" aria-label="Reset count">
      <span>↻</span> Reset count
    </button>
  </div>

  <div class="footnote">
    ⚡ Stack = 10,000 · Bundle = 500 · Pack = 100 notes
  </div>
</div>

<script>
  (function() {
    const denominations = [1000, 500, 200, 100, 50, 20, 10, 5];

    const denomList = document.getElementById('denomList');
    const runningTotalEl = document.getElementById('runningTotal');
    const bottomTotalEl = document.getElementById('bottomTotal');
    const runningNotesSummary = document.getElementById('runningNotesSummary');
    const resetBtn = document.getElementById('resetButton');

    const formatNaira = (value) => {
      return '₦' + value.toLocaleString('en-NG', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    };

    const safeInt = (val) => {
      const num = Math.floor(Number(val));
      return (isNaN(num) || num < 0) ? 0 : num;
    };

    // Build denomination cards
    function buildCards() {
      denomList.innerHTML = '';

      denominations.forEach((denom, idx) => {
        const card = document.createElement('div');
        card.className = 'denom-card';

        // header
        const header = document.createElement('div');
        header.className = 'denom-header';

        const label = document.createElement('div');
        label.className = 'denom-label';
        label.innerHTML = `₦${denom.toLocaleString('en-NG')} <small>note</small>`;

        const rightHeader = document.createElement('div');
        rightHeader.style.display = 'flex';
        rightHeader.style.alignItems = 'center';
        rightHeader.style.gap = '6px';

        const totalNotesBadge = document.createElement('span');
        totalNotesBadge.className = 'denom-total-notes';
        totalNotesBadge.id = `notes-badge-${idx}`;
        totalNotesBadge.textContent = '0';

        const valueBadge = document.createElement('span');
        valueBadge.className = 'denom-total-value';
        valueBadge.id = `value-badge-${idx}`;
        valueBadge.textContent = '₦0.00';

        rightHeader.appendChild(totalNotesBadge);
        rightHeader.appendChild(valueBadge);

        header.appendChild(label);
        header.appendChild(rightHeader);
        card.appendChild(header);

        // unit grid
        const grid = document.createElement('div');
        grid.className = 'unit-grid';

        function createUnitBlock(unitKey, unitLabel) {
          const div = document.createElement('div');
          div.className = 'unit-item';

          const lbl = document.createElement('label');
          lbl.textContent = unitLabel;

          const inp = document.createElement('input');
          inp.type = 'number';
          inp.min = '0';
          inp.step = '1';
          inp.value = '0';
          inp.inputMode = 'numeric';
          inp.setAttribute('aria-label', `${unitLabel} of ${denom} naira notes`);
          inp.dataset.row = idx;
          inp.dataset.unit = unitKey;

          div.appendChild(lbl);
          div.appendChild(inp);
          return div;
        }

        grid.appendChild(createUnitBlock('stacks', 'Stacks'));
        grid.appendChild(createUnitBlock('bundles', 'Bundles'));
        grid.appendChild(createUnitBlock('packs', 'Packs'));

        card.appendChild(grid);
        denomList.appendChild(card);
      });
    }

    function getRowInputs(rowIndex) {
      return {
        stacks: document.querySelector(`input[data-row="${rowIndex}"][data-unit="stacks"]`),
        bundles: document.querySelector(`input[data-row="${rowIndex}"][data-unit="bundles"]`),
        packs: document.querySelector(`input[data-row="${rowIndex}"][data-unit="packs"]`)
      };
    }

    function updateAll() {
      let grandTotal = 0;
      let totalNotesSum = 0;

      denominations.forEach((denom, idx) => {
        const inputs = getRowInputs(idx);
        if (!inputs.stacks || !inputs.bundles || !inputs.packs) return;

        const stacks = safeInt(inputs.stacks.value);
        const bundles = safeInt(inputs.bundles.value);
        const packs = safeInt(inputs.packs.value);

        const notesFromStacks = stacks * 10000;
        const notesFromBundles = bundles * 500;
        const notesFromPacks = packs * 100;
        const totalNotes = notesFromStacks + notesFromBundles + notesFromPacks;

        const value = totalNotes * denom;
        grandTotal += value;
        totalNotesSum += totalNotes;

        const notesBadge = document.getElementById(`notes-badge-${idx}`);
        if (notesBadge) {
          notesBadge.textContent = totalNotes.toLocaleString('en-NG');
        }

        const valueBadge = document.getElementById(`value-badge-${idx}`);
        if (valueBadge) {
          valueBadge.textContent = formatNaira(value);
        }
      });

      const formattedTotal = formatNaira(grandTotal);
      if (runningTotalEl) runningTotalEl.textContent = formattedTotal;
      if (bottomTotalEl) bottomTotalEl.textContent = formattedTotal;

      if (runningNotesSummary) {
        runningNotesSummary.textContent = totalNotesSum.toLocaleString('en-NG') + ' notes';
      }
    }

    function resetAll() {
      denominations.forEach((_, idx) => {
        const inputs = getRowInputs(idx);
        if (inputs.stacks) inputs.stacks.value = '0';
        if (inputs.bundles) inputs.bundles.value = '0';
        if (inputs.packs) inputs.packs.value = '0';
      });
      updateAll();
    }

    function attachListeners() {
      document.addEventListener('input', (e) => {
        if (e.target.matches('input[type="number"][data-row]')) {
          const val = e.target.value;
          if (val !== '') {
            const num = Math.floor(Number(val));
            if (isNaN(num) || num < 0) {
              e.target.value = '0';
            } else {
              e.target.value = num;
            }
          }
          updateAll();
        }
      });

      document.addEventListener('blur', (e) => {
        if (e.target.matches('input[type="number"][data-row]')) {
          const val = e.target.value;
          if (val === '' || val === '0') {
            e.target.value = '0';
          } else {
            const num = Math.floor(Number(val));
            e.target.value = (isNaN(num) || num < 0) ? 0 : num;
          }
          updateAll();
        }
      }, true);

      if (resetBtn) {
        resetBtn.addEventListener('click', resetAll);
      }
    }

    function init() {
      buildCards();
      attachListeners();
      resetAll();
    }

    init();
  })();
</script>
</body>
</html>
